services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etheria
      POSTGRES_USER: etheria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etheria_local_altere}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - ./database/04_functions_triggers.sql:/docker-entrypoint-initdb.d/04_functions_triggers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etheria -d etheria"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  seed:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: etheria
      PGUSER: etheria
      PGPASSWORD: ${POSTGRES_PASSWORD:-etheria_local_altere}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "database/seed.py"]
    restart: "no"
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: etheria
      PGUSER: etheria
      PGPASSWORD: ${POSTGRES_PASSWORD:-etheria_local_altere}
      REDIS_URL: redis://redis:6379/0
      WRITE_API_KEY: ${WRITE_API_KEY:-definir-chave-segura-para-testes}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
volumes:
  postgres_data:
